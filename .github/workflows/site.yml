# Daily: discover startups, refresh StartupDB funding data, and publish the website to GitHub Pages.
# Free on public repositories. Nothing runs on your computer.
#
# One-time setup (repository Settings):
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: VCD_SEC_USER_AGENT   Value: Your Name your.email@example.com   (needed for SEC Form D data)
#   3. Optional, for Reddit: secrets REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, REDDIT_USERNAME
#      (from a "script" app at https://www.reddit.com/prefs/apps). Reddit is skipped until they exist.
#
# Hall of contributors: adding the `hall-approved` label to a "Join the hall" issue republishes the site
# with that contributor's portrait (see CONTRIBUTING.md).
#   4. Optional, for YouTube search: secret YOUTUBE_API_KEY (free key from Google Cloud with the
#      "YouTube Data API v3" enabled). The YouTube channel feeds need no key.
#
# The database is kept between runs on the `discovery-data` branch (one commit, replaced each day).
name: Update data and publish site

on:
  schedule:
    - cron: "17 7 * * *"   # every day at 07:17 UTC
  workflow_dispatch:        # "Run workflow" button on GitHub
  push:
    branches: [main]
    paths: ["vc-investment-tracker-web/**", "discovery-engine/**", ".github/workflows/site.yml"]
  issues:                   # Hall of contributors: republish when a "Join the hall" request is approved or changes
    types: [labeled, unlabeled, edited, closed, reopened, deleted]

permissions:
  contents: write   # save the database to the discovery-data branch
  pages: write
  id-token: write
  issues: write     # read "Join the hall" requests and create the hall-approved label

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Issue events only matter for approved Hall of contributors requests.
    if: github.event_name != 'issues' || github.event.label.name == 'hall-approved' || contains(github.event.issue.labels.*.name, 'hall-approved')
    env:
      # Only the daily schedule and "Run workflow" collect new data; code pushes and hall approvals just republish.
      COLLECT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery-engine/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Restore yesterday's data
        run: |
          if git fetch --depth 1 origin discovery-data; then
            git show FETCH_HEAD:vc_discovery.db > discovery-engine/data/vc_discovery.db && echo "Database restored"
            git show FETCH_HEAD:market.json > vc-investment-tracker-web/public/data/market.json 2>/dev/null \
              || rm -f vc-investment-tracker-web/public/data/market.json
          else
            echo "No saved data yet (first run)"
          fi

      - name: Install discovery engine
        run: pip install -r discovery-engine/requirements.txt

      - name: Test
        run: |
          (cd discovery-engine && python -m pytest)
          (cd vc-investment-tracker-web && node --test && npm run check)

      - name: Discover startups (news, Hacker News, YouTube, SEC Form D)
        if: env.COLLECT == 'true'
        working-directory: discovery-engine
        env:
          VCD_SEC_USER_AGENT: ${{ secrets.VCD_SEC_USER_AGENT }}
          VCD_REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          VCD_REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          VCD_REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          VCD_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -m vcdiscovery.cli init-db
          python -m vcdiscovery.cli run

      - name: Fill missing company facts from Wikidata
        if: env.COLLECT == 'true'
        working-directory: discovery-engine
        run: |
          python -m vcdiscovery.cli enrich
          python -m vcdiscovery.cli refresh-scores

      - name: Refresh StartupDB funding records
        if: env.COLLECT == 'true'
        working-directory: vc-investment-tracker-web
        run: node scripts/update-market.mjs

      - name: Write website data files
        working-directory: discovery-engine
        env:
          VCD_SEC_USER_AGENT: ${{ secrets.VCD_SEC_USER_AGENT }}
          VCD_REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          VCD_REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          VCD_REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        run: |
          python -m vcdiscovery.cli init-db
          python -m vcdiscovery.cli export-site
          python -m vcdiscovery.cli status

      - name: Hall of contributors (approved "Join the hall" requests)
        working-directory: discovery-engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create hall-approved --color C9A227 --description "Approved for the Hall of contributors" 2>/dev/null || true
          python -m vcdiscovery.cli export-hall

      - name: Save data for the next run
        if: env.COLLECT == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import sqlite3; c=sqlite3.connect('discovery-engine/data/vc_discovery.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          state="$RUNNER_TEMP/state"; mkdir -p "$state"
          cp discovery-engine/data/vc_discovery.db "$state/"
          [ -f vc-investment-tracker-web/public/data/market.json ] && cp vc-investment-tracker-web/public/data/market.json "$state/"
          cd "$state"
          git init -q -b discovery-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Data snapshot $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" discovery-data

      - name: Build website
        working-directory: vc-investment-tracker-web
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vc-investment-tracker-web/dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
